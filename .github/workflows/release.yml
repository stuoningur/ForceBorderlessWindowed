name: Release

# First add the version's section to CHANGELOG.md (the release notes come from it), then push a tag that matches
# <Version> in ForceBorderlessWindowed.csproj, e.g.:
#   git tag v0.10.0-beta
#   git push origin v0.10.0-beta
# The result is a draft release: check the notes on GitHub, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Tag matches the project version
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild ForceBorderlessWindowed -getProperty:Version).Trim()
          if ("v$version" -cne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME doesn't match the project version $version (expected tag v$version)"
            exit 1
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Before the build: a release without its changelog section stops here
      - name: CHANGELOG.md has a section for this version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/scripts/Get-ChangelogSection.ps1 -Version $env:VERSION | Out-Null

  build:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check-version, build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ForceBorderlessWindowed
          path: release

      # Unix line ending: "sha256sum -c" on Linux and macOS reads a CR as part of the file name
      - name: Checksum
        shell: pwsh
        working-directory: release
        run: |
          $hash = (Get-FileHash ForceBorderlessWindowed.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", "$hash  ForceBorderlessWindowed.exe`n", [Text.Encoding]::ASCII)

      # The version's CHANGELOG.md section, then the download notes that every release repeats
      - name: Release notes
        shell: pwsh
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $section = ./.github/scripts/Get-ChangelogSection.ps1 -Version $env:VERSION
          $footer = Get-Content .github/release-notes-footer.md -Raw -Encoding utf8
          [IO.File]::WriteAllText("$PWD/release/notes.md", ($section -join "`n") + "`n" + $footer, [Text.UTF8Encoding]::new($false))

      # A version with a suffix ("0.9.0-beta") is marked as a pre-release
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            'release/ForceBorderlessWindowed.exe', 'release/SHA256SUMS.txt',
            '--draft', '--notes-file', 'release/notes.md', '--verify-tag',
            '--title', "Force Borderless Windowed $env:VERSION"
          )
          if ($env:VERSION.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
